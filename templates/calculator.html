<!doctype html>
<html lang="{{lang}}">
  {{> head}}
  <body>
    {{> navigation}}

    <main>
      <!-- ===== CALCULATOR HERO ===== -->
      <section class="hero hero--compact">
        <div class="hero__bg"></div>
        <div class="container hero__inner">
          <h1 class="hero__title">{{t.calc.hero.title}}</h1>
          <p class="hero__subtitle">{{t.calc.hero.subtitle}}</p>
        </div>
      </section>

      <!-- ===== CALCULATOR ===== -->
      <section class="section calculator" id="calculator">
        <div class="container">
          <div class="calculator__grid">
            <div class="calculator__card calculator__form">
              <div class="calculator__field">
                <label for="calc-amount">{{t.calc.amount}}</label>
                <input
                  type="number"
                  id="calc-amount"
                  value="10000"
                  min="0"
                  step="100"
                />
              </div>
              <div class="calculator__field">
                <label for="calc-rate">{{t.calc.rate}}</label>
                <input
                  type="number"
                  id="calc-rate"
                  value="15"
                  min="0"
                  step="0.1"
                />
              </div>
              <div class="calculator__field">
                <label for="calc-term">{{t.calc.term_label}}</label>
                <div class="calculator__term">
                  <input
                    type="number"
                    id="calc-term"
                    value="1"
                    min="1"
                    step="1"
                  />
                  <select id="calc-term-type" class="calculator__select">
                    <option value="months">{{t.calc.term.months}}</option>
                    <option value="years" selected>
                      {{t.calc.term.years}}
                    </option>
                  </select>
                </div>
              </div>
              <div class="calculator__field">
                <label for="calc-contribution">{{t.calc.contribution}}</label>
                <input
                  type="number"
                  id="calc-contribution"
                  value="0"
                  min="0"
                  step="100"
                />
              </div>
            </div>
            <div class="calculator__card calculator__results">
              <div class="calculator__result">
                <span class="calculator__label">{{t.calc.final}}</span>
                <strong class="calculator__value" id="calc-final">0,00</strong>
              </div>
              <div class="calculator__result">
                <span class="calculator__label">{{t.calc.profit}}</span>
                <strong class="calculator__value" id="calc-profit">0,00</strong>
              </div>
              <div class="calculator__result">
                <span class="calculator__label">{{t.calc.contributions}}</span>
                <strong class="calculator__value" id="calc-contributions"
                  >0,00</strong
                >
              </div>
            </div>
          </div>
          <div class="calculator__cta">
            <a href="index.html#contact" class="btn btn--primary"
              >{{t.calc.cta}}</a
            >
          </div>
          <button
            class="calculator__toggle"
            id="calc-table-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="calc-table-wrapper"
          >
            {{t.calc.toggle}}
            <svg
              class="calculator__toggle-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="calculator__table-wrapper" id="calc-table-wrapper" hidden>
            <table class="calculator__table">
              <thead>
                <tr>
                  <th>{{t.calc.table.month}}</th>
                  <th>{{t.calc.table.contribution}}</th>
                  <th>{{t.calc.table.return}}</th>
                  <th>{{t.calc.table.total}}</th>
                </tr>
              </thead>
              <tbody id="calc-table-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    {{> footer}}

    <!-- Scripts -->

    <script src="{{base}}/js/main.js"></script>
  </body>
</html>
