name: Validate site

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate generated pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test site
        run: npm test

      - name: Check generated pages are committed
        run: |
          changes=$(git status --porcelain -- uk/ en/ sitemap.xml)
          if [ -n "$changes" ]; then
            echo "::error::Run npm run build and commit generated files."
            printf '%s\n' "$changes"
            exit 1
          fi
