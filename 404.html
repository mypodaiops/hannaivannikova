<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html.is-translating body {
        visibility: hidden;
      }
    </style>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const lang = params.get("lang");
        if (lang === "en" || lang === "uk") {
          document.documentElement.lang = lang;
        }
        if (lang === "en" || localStorage.getItem("hanna-lang") === "en") {
          document.documentElement.classList.add("is-translating");
        }
        setTimeout(() => {
          document.documentElement.classList.remove("is-translating");
        }, 2000);
      })();
    </script>
    <title>Сторінку не знайдено — Ганна Іваннікова</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="header" id="header">
      <div class="container header__inner">
        <a href="./index.html" class="logo">Ганна Іваннікова</a>
      </div>
    </header>
    <main class="not-found">
      <div>
        <h1 class="not-found__code">404</h1>
        <p class="not-found__text" data-i18n="404.text">Сторінку не знайдено</p>
        <a href="./index.html" class="btn btn--primary" data-i18n="404.home"
          >На головну</a
        >
      </div>
    </main>
    <script src="js/translations.js"></script>
    <script src="js/i18n.js"></script>
  </body>
</html>
